<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas de Gimnasio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header con logo -->
    <header>
        <div class="container header-content">
            <img src="./multimedia/logo-codegym.png" alt="Logo del Gimnasio" class="logo">
            <h1>Reservas</h1>
        </div>
    </header>

    <!-- Contenido principal -->
    <div class="container">
        <div id="simulador">
            <h2>Realizar una Reserva</h2>
            <form id="formReserva">
                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" required>
                </div>
                <div class="form-group">
                    <label for="horario">Horario:</label>
                    <select id="horario" required></select>
                </div>
                <button type="submit">Reservar</button>
            </form>
            <h2>Reservas Confirmadas</h2>
            <ul id="listaReservas"></ul>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2024 Codegym - Todos los derechos reservados</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
